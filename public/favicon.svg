<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon : la jauge du logo (maquette Claude Design « Accueil v3 »),
       sur fond transparent pour se poser sur la barre d'onglets. En thème
       sombre, l'aiguille passe au clair pour rester visible. Les icônes
       d'application (PNG) ont leur propre source à fond plein :
       scripts/brand/app-icon.svg. Pas de double tiret dans ce commentaire :
       XML l'interdit et le SVG entier cesserait de s'afficher. -->
  <style>
    .arc { fill: none; stroke: #ec3013; stroke-width: 4.4; stroke-dasharray: 60 15.4; }
    .needle { stroke: #18181b; stroke-width: 3.6; stroke-linecap: round; }
    .hub { fill: #18181b; }
    @media (prefers-color-scheme: dark) {
      .arc { stroke: #ff563c; }
      .needle { stroke: #f4f4f5; }
      .hub { fill: #f4f4f5; }
    }
  </style>
  <circle class="arc" cx="16" cy="16" r="12"/>
  <path class="needle" d="M16 16 23.5 9"/>
  <circle class="hub" cx="16" cy="16" r="2.6"/>
</svg>
